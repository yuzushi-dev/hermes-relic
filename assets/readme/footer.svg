<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 46" width="830" height="46" role="img" aria-labelledby="ttl dsc">
<title id="ttl">END OF TRANSMISSION — local state remains private</title>
<desc id="dsc">Closing bar. A hex serial for gumi, the line END OF TRANSMISSION and LOCAL STATE REMAINS PRIVATE, and a LOCAL readout whose twelve segments are all lit.</desc>

<defs>
<radialGradient id="bloom" cx="0.5" cy="-0.12" r="1.1">
<stop offset="0" stop-color="#ff003c" stop-opacity="0.20"/>
<stop offset="0.6" stop-color="#ff003c" stop-opacity="0"/>
</radialGradient>
<radialGradient id="reverb" cx="0.5" cy="1.18" r="0.95">
<stop offset="0" stop-color="#ff003c" stop-opacity="0.07"/>
<stop offset="0.55" stop-color="#ff003c" stop-opacity="0"/>
</radialGradient>
<pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse">
<rect y="2" width="4" height="1" fill="#ff003c" opacity="0.05"/>
</pattern>
<filter id="grain" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
<feColorMatrix type="saturate" values="0"/>
<feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
<feComposite operator="in" in2="SourceGraphic"/>
</filter>
<filter id="glow" x="-400%" y="-400%" width="900%" height="900%">
<feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ff003c" flood-opacity="0.45"/>
</filter>
<filter id="glowY" x="-400%" y="-400%" width="900%" height="900%">
<feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#ffe23a" flood-opacity="0.45"/>
</filter>
</defs>
<clipPath id="frame"><polygon points="0.0,0.0 818.0,0.0 830.0,12.0 830.0,46.0 8.0,46.0 0.0,38.0"/></clipPath>
<polygon points="0.5,0.5 817.5,0.5 829.5,12.5 829.5,45.5 8.5,45.5 0.5,37.5" fill="#0a0608" stroke="#6e2d38" stroke-width="1"/>
<g clip-path="url(#frame)">
<rect width="830" height="46" fill="url(#bloom)"/>
<rect width="830" height="46" fill="url(#reverb)"/>
<rect width="830" height="46" fill="url(#scan)"/>
<rect width="830" height="46" fill="#808080" filter="url(#grain)"/>
<rect x="1" y="1" width="816" height="1.5" fill="#ff003c" filter="url(#glow)"/>
</g>
<path d="M817.5,0.5 L829.5,12.5" stroke="#ff003c" stroke-width="1.2" fill="none" filter="url(#glow)"/>
<path d="M0.5,37.5 L8.5,45.5" stroke="#ff003c" stroke-width="1.2" fill="none" filter="url(#glow)" opacity="0.75"/>
<path d="M3,9 V3 H9" stroke="#ff003c" stroke-width="1.2" fill="none" filter="url(#glow)"/>
<path d="M827,37 V43 H821" stroke="#ff003c" stroke-width="1.2" fill="none" filter="url(#glow)" opacity="0.75"/>
<text x="24" y="28" font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,ui-monospace,monospace" font-size="11" fill="#ff4d62" letter-spacing="1.2" font-weight="500" opacity="0.85">0x00 67 75 6D 69</text>
<rect x="168" y="14" width="1" height="18" fill="#6e2d38"/>
