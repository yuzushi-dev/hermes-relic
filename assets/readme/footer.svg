<text x="358" y="28" font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,ui-monospace,monospace" font-size="11" fill="#ff003c" letter-spacing="1.8" font-weight="600">//</text>
<text x="386" y="28" font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,ui-monospace,monospace" font-size="11" fill="#c8b9bd" letter-spacing="1.8" font-weight="500" opacity="0.9">LOCAL STATE REMAINS PRIVATE</text>
