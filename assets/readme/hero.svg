<text x="786" y="110" font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,ui-monospace,monospace" font-size="11" fill="#3df0ff" letter-spacing="0.6" text-anchor="end" font-weight="600">~/.relic/user</text>
<rect x="484" y="130" width="6" height="6" fill="#00e5ff"/>
<text x="500" y="138" font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,ui-monospace,monospace" font-size="11" fill="#c8b9bd" letter-spacing="1.2" font-weight="500" opacity="0.8">RUNTIME</text>
<text x="786" y="138" font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,ui-monospace,monospace" font-size="11" fill="#3df0ff" letter-spacing="0.6" text-anchor="end" font-weight="600">FOREGROUND · USER_VISIBLE</text>
<rect x="484" y="158" width="6" height="6" fill="#ffe23a"/>
<text x="500" y="166" font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,ui-monospace,monospace" font-size="11" fill="#c8b9bd" letter-spacing="1.2" font-weight="500" opacity="0.8">DELIVERY</text>
<text x="786" y="166" font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,ui-monospace,monospace" font-size="11" fill="#ffd83a" letter-spacing="0.6" text-anchor="end" font-weight="600">OPT-IN · OFF BY DEFAULT</text>
<g transform="rotate(90 816 62)"><text x="816" y="62" font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,ui-monospace,monospace" font-size="11" fill="#1f8a99" letter-spacing="1.4" font-weight="500" opacity="0.65">1001 0110 1101</text></g>
<text x="30" y="212" font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,ui-monospace,monospace" font-size="11" fill="#ff4d62" letter-spacing="1.2" font-weight="500" opacity="0.85">PROFILE PLUGIN // COPIED, NOT LINKED</text>
