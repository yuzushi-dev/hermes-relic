<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 230" width="830" height="230" role="img" aria-labelledby="ttl dsc">
<title id="ttl">RELIC GUMI — native Hermes continuity</title>
<desc id="dsc">Cyber-terminal masthead. Wordmark RELIC GUMI over the line NATIVE HERMES CONTINUITY and the summary SINGLE USER, PRIVATE STATE, THREE HOOKS. A side readout lists scope ~/.relic/user, runtime foreground and user_visible, and delivery opt-in and off by default.</desc>

<defs>
<radialGradient id="bloom" cx="0.5" cy="-0.12" r="1.1">
<stop offset="0" stop-color="#ff003c" stop-opacity="0.20"/>
<stop offset="0.6" stop-color="#ff003c" stop-opacity="0"/>
</radialGradient>
<radialGradient id="reverb" cx="0.5" cy="1.18" r="0.95">
<stop offset="0" stop-color="#ff003c" stop-opacity="0.07"/>
<stop offset="0.55" stop-color="#ff003c" stop-opacity="0"/>
</radialGradient>
<pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse">
<rect y="2" width="4" height="1" fill="#ff003c" opacity="0.05"/>
</pattern>
<filter id="grain" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
<feColorMatrix type="saturate" values="0"/>
<feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
<feComposite operator="in" in2="SourceGraphic"/>
</filter>
<filter id="glow" x="-400%" y="-400%" width="900%" height="900%">
<feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ff003c" flood-opacity="0.45"/>
</filter>
<filter id="glowY" x="-400%" y="-400%" width="900%" height="900%">
<feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#ffe23a" flood-opacity="0.45"/>
</filter>
</defs>
<clipPath id="frame"><polygon points="0.0,0.0 814.0,0.0 830.0,16.0 830.0,230.0 10.0,230.0 0.0,220.0"/></clipPath>
<polygon points="0.5,0.5 813.5,0.5 829.5,16.5 829.5,229.5 10.5,229.5 0.5,219.5" fill="#0a0608" stroke="#6e2d38" stroke-width="1"/>
<g clip-path="url(#frame)">
<rect width="830" height="230" fill="url(#bloom)"/>
<rect width="830" height="230" fill="url(#reverb)"/>
<rect width="830" height="230" fill="url(#scan)"/>
<rect width="830" height="230" fill="#808080" filter="url(#grain)"/>
<rect x="1" y="1" width="812" height="1.5" fill="#ff003c" filter="url(#glow)"/>
</g>
<path d="M813.5,0.5 L829.5,16.5" stroke="#ff003c" stroke-width="1.5" fill="none" filter="url(#glow)"/>
<path d="M0.5,219.5 L10.5,229.5" stroke="#ff003c" stroke-width="1.5" fill="none" filter="url(#glow)" opacity="0.75"/>
<path d="M3,12 V3 H12" stroke="#ff003c" stroke-width="1.5" fill="none" filter="url(#glow)"/>
<path d="M827,218 V227 H818" stroke="#ff003c" stroke-width="1.5" fill="none" filter="url(#glow)" opacity="0.75"/>
<rect x="10" y="40" width="6" height="1" fill="#8f1f30" opacity="0.6"/><rect x="10" y="53" width="6" height="1" fill="#8f1f30" opacity="0.6"/><rect x="10" y="66" width="6" height="1" fill="#8f1f30" opacity="0.6"/><rect x="10" y="79" width="6" height="1" fill="#8f1f30" opacity="0.6"/><rect x="10" y="92" width="6" height="1" fill="#8f1f30" opacity="0.6"/><rect x="10" y="105" width="6" height="1" fill="#8f1f30" opacity="0.6"/><rect x="10" y="118" width="6" height="1" fill="#8f1f30" opacity="0.6"/><rect x="10" y="131" width="6" height="1" fill="#8f1f30" opacity="0.6"/><rect x="10" y="144" width="6" height="1" fill="#8f1f30" opacity="0.6"/><rect x="10" y="157" width="6" height="1" fill="#8f1f30" opacity="0.6"/><rect x="10" y="170" width="6" height="1" fill="#8f1f30" opacity="0.6"/><rect x="10" y="183" width="6" height="1" fill="#8f1f30" opacity="0.6"/><rect x="10" y="196" width="6" height="1" fill="#8f1f30" opacity="0.6"/>
<text x="30" y="30" font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,ui-monospace,monospace" font-size="11" fill="#ff4d62" letter-spacing="1.6" font-weight="500" opacity="0.85">PROTOCOL 6520-A44</text>
<text x="181" y="30" font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,ui-monospace,monospace" font-size="11" fill="#ff003c" letter-spacing="1.6" font-weight="600">//</text>
<text x="206" y="30" font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,ui-monospace,monospace" font-size="11" fill="#ff4d62" letter-spacing="1.6" font-weight="500" opacity="0.85">TRN_RGUMI_8D0095</text>
