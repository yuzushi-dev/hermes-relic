<text x="484" y="80" font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,ui-monospace,monospace" font-size="11" fill="#ff4d62" letter-spacing="2.4" font-weight="600" opacity="0.85">STATUS</text>
<text x="786" y="80" font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,ui-monospace,monospace" font-size="11" fill="#ff4d62" letter-spacing="2.4" text-anchor="end" font-weight="500" opacity="0.6">RG-00</text>
