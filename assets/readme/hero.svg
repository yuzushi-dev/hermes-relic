<text x="32" y="172" font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,ui-monospace,monospace" font-size="11" fill="#c8b9bd" letter-spacing="2.2" font-weight="500" opacity="0.85">SINGLE USER · PRIVATE STATE · THREE HOOKS</text>
