<rect x="22" y="87" width="2" height="88" fill="#ff003c" opacity="0.8"/>
<text x="30" y="116" font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,ui-monospace,monospace" font-size="42" fill="#f3eef0" letter-spacing="11" font-weight="700">RELIC</text>
<text x="232" y="116" font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,ui-monospace,monospace" font-size="42" fill="#ff4d62" letter-spacing="11" font-weight="700">GUMI</text>
