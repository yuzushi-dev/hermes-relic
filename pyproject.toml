[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "relic-gumi"
version = "0.1.0"
description = "Native Hermes Gumi User plugin"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-or-later"}
authors = [{name = "Relic Maintainers"}]
dependencies = [
    "jsonschema>=4.0,<5",
    "pydantic>=2.0,<3",
    "PyYAML>=6.0,<7",
    "structlog>=24.0,<27",
    "requests>=2.28,<3",
]

[project.scripts]
relic-gumi = "relic.gumi_install:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["relic*"]

[tool.setuptools.package-data]
relic = ["**/*.sql", "**/*.json", "**/*.md"]
"relic.hermes_plugin.gumi_entry" = ["plugin.yaml"]

[tool.pytest.ini_options]
markers = [
    "live: hits a real model backend; requires RELIC_JUDGE_BASE_URL",
]
